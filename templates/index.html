<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MP331 — YouTube to MP3</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;500&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <!-- Ambient background blobs -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="noise"></div>

    <div class="page-wrapper">

        <!-- Header -->
        <header class="header">
            <div class="logo">
                <span class="logo-icon">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                        <path d="M9 18V5l12-2v13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <circle cx="6" cy="18" r="3" stroke="currentColor" stroke-width="2"/>
                        <circle cx="18" cy="16" r="3" stroke="currentColor" stroke-width="2"/>
                    </svg>
                </span>
                <span class="logo-text"><span class="logo-red">MP3</span><span class="logo-white">31</span></span>
            </div>
            <div class="header-badge" id="headerBadge">192kbps • MP3</div>
        </header>

        <!-- Hero -->
        <main class="hero">
            <div class="hero-tag">YouTube → MP3 Dönüştürücü</div>
            <h1 class="hero-title">
                Müziğini<br><em>özgür</em> bırak
            </h1>
            <p class="hero-sub">YouTube linkini yapıştır, yüksek kaliteli MP3'ü saniyeler içinde indir.</p>

            <!-- Waveform decoration -->
            <div class="waveform" aria-hidden="true">
                <span></span><span></span><span></span><span></span><span></span>
                <span></span><span></span><span></span><span></span><span></span>
                <span></span><span></span><span></span><span></span><span></span>
                <span></span><span></span><span></span><span></span><span></span>
                <span></span><span></span><span></span><span></span><span></span>
                <span></span><span></span><span></span><span></span><span></span>
            </div>

            <!-- Main Card -->
            <div class="card">
                <form id="downloadForm" action="/download" method="post">
                    <div class="input-group">
                        <div class="input-icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                                <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </div>
                        <input
                            type="text"
                            name="url"
                            id="urlInput"
                            placeholder="https://youtube.com/watch?v=..."
                            autocomplete="off"
                            required
                        >
                        <button type="button" id="pasteBtn" class="paste-btn" title="Panodan yapıştır">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
                                <rect x="9" y="9" width="13" height="13" rx="2" stroke="currentColor" stroke-width="2"/>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" stroke="currentColor" stroke-width="2"/>
                            </svg>
                        </button>
                    </div>

                    <!-- Quality Selector -->
                    <div class="quality-group">
                        <span class="quality-label">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none">
                                <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                                <path d="M19 10v2a7 7 0 0 1-14 0v-2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                                <line x1="12" y1="19" x2="12" y2="23" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            </svg>
                            Kalite
                        </span>
                        <div class="quality-options">
                            <label class="quality-opt">
                                <input type="radio" name="quality" value="128"> 
                                <span>128<em>kbps</em></span>
                            </label>
                            <label class="quality-opt">
                                <input type="radio" name="quality" value="192" checked>
                                <span>192<em>kbps</em></span>
                            </label>
                            <label class="quality-opt">
                                <input type="radio" name="quality" value="256">
                                <span>256<em>kbps</em></span>
                            </label>
                            <label class="quality-opt">
                                <input type="radio" name="quality" value="320">
                                <span>320<em>kbps</em> <b>MAX</b></span>
                            </label>
                        </div>
                    </div>

                    <button type="submit" class="download-btn" id="downloadBtn">
                        <span class="btn-default">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                                <polyline points="7,10 12,15 17,10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                <line x1="12" y1="15" x2="12" y2="3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            </svg>
                            İndir ve Dönüştür
                        </span>
                        <span class="btn-loading">
                            <span class="spinner"></span>
                            Dönüştürülüyor...
                        </span>
                    </button>
                </form>

                <!-- Status messages -->
                <div id="statusMsg" class="status-msg" hidden></div>
            </div>

            <!-- Features -->
            <div class="features">
                <div class="feature">
                    <span class="feature-icon">⚡</span>
                    <span>Hızlı dönüşüm</span>
                </div>
                <div class="feature-divider"></div>
                <div class="feature">
                    <span class="feature-icon">🎵</span>
                    <span id="featQuality">192 kbps MP3</span>
                </div>
                <div class="feature-divider"></div>
                <div class="feature">
                    <span class="feature-icon">🔒</span>
                    <span>Dosyalar saklanmaz</span>
                </div>
            </div>
        </main>

        <!-- Crosslink -->
        <a href="https://mp404.onrender.com/" target="_blank" class="crosslink">
            <span class="crosslink-icon">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
                    <polygon points="5,3 19,12 5,21" fill="currentColor"/>
                </svg>
            </span>
            <span class="crosslink-text">
                <span class="crosslink-label">Video mu indirmek istiyorsun?</span>
                <span class="crosslink-brand"><span class="cl-mp4">MP4</span><span class="cl-04">04</span> →</span>
            </span>
        </a>

        <!-- Footer -->
        <footer class="footer">
            <p>Kişisel kullanım için geliştirilmiştir • 331 Studios</p>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
